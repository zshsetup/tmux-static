name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the release tag matches VERSION, the tag checked out in vendor/tmux
        run: |
          if [ "$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))"
            exit 1
          fi
  build:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
          - os: ubuntu-latest
            asset: linux-amd64
          - os: ubuntu-24.04-arm
            asset: linux-arm64
          - os: ubuntu-latest
            asset: linux-musl-amd64
            static: true
          - os: ubuntu-24.04-arm
            asset: linux-musl-arm64
            static: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/fetch-submodules.sh
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config bison
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config
      - run: ./build.sh ${{ matrix.static && '--static' || '' }}
      - name: Package tmux
        run: |
          dist="dist${{ matrix.static && '-static' || '' }}"
          tar -czf tmux-static-${{ matrix.asset }}.tar.gz -C "$dist" bin share
      - name: Collect sources
        if: matrix.asset == 'linux-amd64'
        run: tar -czf tmux-static-sources.tar.gz --exclude=.git vendor
      - uses: actions/upload-artifact@v7
        with:
          name: tmux-static-${{ matrix.asset }}
          path: tmux-static-*.tar.gz
          retention-days: 1
  release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tmux-static-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
